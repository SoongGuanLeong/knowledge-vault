# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  poem: false
  review_status: true
  high_level_summary: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/knowledge_vault/**/*.py"
      instructions: |
        Review Python against docs/standards/python.md.
    - path: "tests/**/*.py"
      instructions: |
        Review tests against docs/standards/testing.md.
  tools:
    ruff:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
chat:
  auto_reply: true
