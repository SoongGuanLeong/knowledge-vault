[project]
name = "knowledge-vault"
version = "0.1.0"
description = "Reproducible knowledge ingestion foundation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
kv = "knowledge_vault.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.12",
    "basedpyright>=1.31",
    "pytest>=8",
    "pytest-cov>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_vault"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.bandit]
skips = ["B404", "B603", "B607"]

[tool.basedpyright]
include = ["src"]
exclude = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=knowledge_vault",
    "--cov-report=term-missing",
    "--cov-fail-under=56",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
]
