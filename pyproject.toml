[project]
name = "knowledge-vault"
version = "0.1.0"
description = "Reproducible knowledge ingestion foundation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
kv = "knowledge_vault.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.12",
    "pyright>=1.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_vault"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
