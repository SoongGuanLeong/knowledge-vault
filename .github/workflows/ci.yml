name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # astral-sh/setup-uv@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      # actions/setup-python@v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - run: uv sync --all-extras --dev

      - name: Gitleaks (security)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xzf - -C /usr/local/bin gitleaks
          gitleaks detect --source . -v

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: basedpyright (types)
        run: uv run basedpyright

      - name: Pytest (with coverage gate)
        run: make coverage

      - name: Bandit (security scan)
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Semgrep (SAST)
        run: uv run semgrep scan --config auto --error

      - name: pip-audit (supply chain)
        # PYSEC-2026-3481/3482/3483 in mcp==1.23.3 pinned by semgrep's optional MCP-server feature,
        # not exercised by the scan path; ignored (see Makefile).
        run: uv run pip-audit --ignore-vuln PYSEC-2026-3481 --ignore-vuln PYSEC-2026-3482 --ignore-vuln PYSEC-2026-3483