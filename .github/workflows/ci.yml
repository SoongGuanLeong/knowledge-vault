name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: uv sync --all-extras --dev

      - name: Gitleaks (security)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xzf - -C /usr/local/bin gitleaks
          gitleaks detect --source . -v

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: basedpyright (types)
        run: uv run basedpyright

      - name: Pytest
        run: uv run pytest

      - name: Bandit (security scan)
        run: uv run bandit -r src/ -c pyproject.toml

      - name: pip-audit (supply chain)
        run: uv run pip-audit